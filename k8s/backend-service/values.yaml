# Default values for backend-service (local/development defaults).
# Production overrides live in values-production.yaml.

replicaCount: 1

image:
  repository: solid-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# Chart name overrides (consumed by _helpers.tpl); leave empty to use the chart name.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  annotations: {}
  # Name of the service account to use; generated from the fullname template if empty.
  name: ""

# Annotations added to the backend Pod.
podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Application settings surfaced as env vars in deployment.yaml.
app:
  environment: development
  frontendUrl: "http://localhost:8080"
  gcpRedirectUri: "http://localhost:8080/api/auth/callback"
  corsAllowedOrigins: "http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080"
  allowedHosts: "localhost,127.0.0.1"
  docsEnabled: true
  securityHeadersEnabled: true
  trustProxyHeaders: false
  strictTransportSecuritySeconds: 31536000
  session:
    httpsOnly: false
    sameSite: lax

auth:
  # When set, env vars are sourced from this existing secret instead of the values below.
  existingSecret: ""
  jwtSecretKey: "development-jwt-secret-change-me-1234567890"
  sessionSecretKey: "development-session-secret-change-me-1234567890"
  gcpClientId: ""
  gcpClientSecret: ""
  adminEmail: ""
  gemApiKey: ""

service:
  type: ClusterIP
  port: 80

database:
  url: "sqlite:///./app.db"
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

storage:
  size: 1Gi

migrations:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300

observability:
  otel:
    enabled: false
    serviceName: "solid-backend"
    exporter:
      endpoint: "http://otel-collector-opentelemetry-collector.default.svc.cluster.local:4318"
      protocol: "http/protobuf"
    resourceAttributes: "deployment.environment=local"
  logs:
    enabled: true
    podAnnotations:
      loki.grafana.com/scrape: "true"
      loki.grafana.com/job: "solid-backend"

ingress:
  enabled: true
  className: traefik-solid
  annotations: {}
  host: localhost
  tls:
    enabled: false
    secretName: ""
    certResolver: ""
  # Optional Grafana routing (local convenience); disabled by default.
  monitoring:
    enabled: false
    host: monitoring.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
    httpHeaders:
      - name: Host
        value: localhost
readinessProbe:
  httpGet:
    path: /health
    port: http
    httpHeaders:
      - name: Host
        value: localhost
