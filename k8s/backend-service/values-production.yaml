replicaCount: 1

image:
  repository: solid-backend
  pullPolicy: IfNotPresent
  tag: "prod-local"

app:
  environment: production
  frontendUrl: "https://example.com"
  gcpRedirectUri: "https://example.com/api/auth/callback"
  corsAllowedOrigins: "https://example.com"
  allowedHosts: "example.com"
  docsEnabled: false
  securityHeadersEnabled: true
  trustProxyHeaders: true
  strictTransportSecuritySeconds: 31536000
  session:
    httpsOnly: true
    sameSite: lax

auth:
  existingSecret: backend-auth

database:
  existingSecret: backend-db
  existingSecretKey: DATABASE_URL

storage:
  size: 3Gi

observability:
  otel:
    enabled: true
    serviceName: "solid-backend"
    exporter:
      endpoint: "http://alloy.default.svc.cluster.local:4318"
      protocol: "http/protobuf"
    resourceAttributes: "deployment.environment=production,service.namespace=default"
  logs:
    enabled: true
    podAnnotations:
      loki.grafana.com/scrape: "true"
      loki.grafana.com/job: "solid-backend"

ingress:
  enabled: true
  className: traefik-solid
  annotations: {}
  host: example.com
  tls:
    enabled: true
    secretName: ""
    certResolver: letsencrypt

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi