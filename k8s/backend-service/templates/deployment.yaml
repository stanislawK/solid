apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-service.fullname" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.observability.logs.enabled }}
      annotations:
        {{- with .Values.observability.logs.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        app: solid-backend
        {{- include "backend-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backend-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.observability.glitchtip.enabled }}
            - name: GLITCHTIP_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.glitchtip.existingSecret }}
                  key: {{ .Values.observability.glitchtip.existingSecretKey }}
            {{- end }}
            - name: ENVIRONMENT
              value: {{ .Values.app.environment | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: FRONTEND_URL
              value: {{ .Values.app.frontendUrl | quote }}
            - name: GCP_REDIRECT_URI
              value: {{ .Values.app.gcpRedirectUri | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.app.corsAllowedOrigins | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.app.allowedHosts | quote }}
            - name: DOCS_ENABLED
              value: {{ .Values.app.docsEnabled | quote }}
            - name: SECURITY_HEADERS_ENABLED
              value: {{ .Values.app.securityHeadersEnabled | quote }}
            - name: TRUST_PROXY_HEADERS
              value: {{ .Values.app.trustProxyHeaders | quote }}
            - name: STRICT_TRANSPORT_SECURITY_SECONDS
              value: {{ printf "%d" (int .Values.app.strictTransportSecuritySeconds) | quote }}
            - name: SESSION_HTTPS_ONLY
              value: {{ .Values.app.session.httpsOnly | quote }}
            - name: SESSION_SAME_SITE
              value: {{ .Values.app.session.sameSite | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.observability.otel.enabled | quote }}
            - name: STORAGE_DIR
              value: /app/data
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: JWT_SECRET_KEY
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: SESSION_SECRET_KEY
            {{- if or .Values.auth.existingSecret .Values.auth.gcpClientId }}
            - name: GCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: GCP_CLIENT_ID
                  optional: true
            {{- end }}
            {{- if or .Values.auth.existingSecret .Values.auth.gcpClientSecret }}
            - name: GCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: GCP_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- if or .Values.auth.existingSecret .Values.auth.adminEmail }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: ADMIN_EMAIL
                  optional: true
            {{- end }}
            {{- if or .Values.auth.existingSecret .Values.auth.gemApiKey }}
            - name: GEM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-service.authSecretName" . }}
                  key: GEM_API_KEY
                  optional: true
            {{- end }}
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.otel.serviceName | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.exporter.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.otel.exporter.protocol | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.observability.otel.resourceAttributes | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "backend-service.fullname" . }}-data
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
